<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account | PizzaCraft</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🍕</span>
        <div>Pizza<span>Craft</span></div>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu & Order</a>
        <a href="blog.html" class="nav-link">Pizza Stories</a>
        <a href="create-blog.html" class="nav-link">Create Blog</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
      </nav>

      <div class="nav-actions">
        <button class="cart-btn" id="openCartBtn" aria-label="View Cart">
          <span>🛒</span>
          <span class="cart-count">0</span>
        </button>

        <div id="userNavActions" style="display: flex; align-items: center; gap: 10px;">
          <!-- Dynamically populated -->
        </div>

        <button class="mobile-menu-btn" id="mobileMenuToggle" aria-label="Toggle Navigation">
          ☰
        </button>
      </div>
    </div>
  </header>

  <!-- Register Main Content -->
  <main class="auth-page">
    <div class="container" style="display: flex; justify-content: center;">
      <div class="auth-card">
        <div class="auth-header">
          <span class="logo-icon">🍕</span>
          <h1 class="auth-title">Join PizzaCraft Club</h1>
          <p class="auth-subtitle">Get 100 bonus loyalty points upon sign up!</p>
        </div>

        <div id="authError" style="color: var(--primary); font-size: 0.88rem; font-weight: 600; margin-bottom: 16px; text-align: center;"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="regName" class="form-label">Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="e.g. Alex Johnson" required>
          </div>

          <div class="form-group">
            <label for="regEmail" class="form-label">Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label for="regPhone" class="form-label">Mobile Number</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+91 98765 43210" required>
          </div>

          <div class="form-group">
            <label for="regPassword" class="form-label">Create Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" minlength="6" required>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-type password" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
            Create Free Account ➔
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign In Here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Cart Slide-Over Drawer -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3><span>🛒</span> Your Pizza Cart</h3>
      <button class="close-drawer-btn" id="closeCartBtn">&times;</button>
    </div>
    <div class="cart-body" id="cartDrawerItems"></div>
    <div class="cart-footer">
      <div class="cart-summary-total">
        <span>Total Amount</span>
        <span id="cartTotal">₹0.00</span>
      </div>
      <button class="btn btn-primary checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
    </div>
  </aside>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom" style="border: none; padding-top: 0;">
      <div>&copy; 2026 PizzaCraft. Secure Authenticated Platform.</div>
      <div><a href="index.html" style="color: var(--primary);">Return to Homepage</a></div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
