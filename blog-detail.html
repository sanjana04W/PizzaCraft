<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PizzaCraft | Pizza Story</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* ── Blog Detail Page Styles ── */
    .blog-detail-hero {
      position: relative;
      width: 100%;
      height: 480px;
      overflow: hidden;
      background: #1a1a1a;
    }
    .blog-detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.65;
    }
    .blog-detail-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.75) 100%);
      display: flex;
      align-items: flex-end;
      padding: 2.5rem;
    }
    .blog-detail-hero-content {
      max-width: 820px;
    }
    .blog-detail-hero-content .blog-category-tag {
      font-size: 0.8rem;
      padding: 0.3rem 0.9rem;
      margin-bottom: 0.8rem;
      display: inline-block;
    }
    .blog-detail-hero-content h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
      margin: 0 0 1rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .blog-detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      color: rgba(255,255,255,0.85);
      font-size: 0.88rem;
    }
    .blog-detail-author-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .blog-detail-author-row img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #FF3838;
    }

    /* ── Article Body ── */
    .blog-detail-body {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    .blog-detail-content {
      font-size: 1.08rem;
      line-height: 1.9;
      color: #333;
    }
    .blog-detail-content p {
      margin-bottom: 1.4rem;
    }

    /* ── Like Bar ── */
    .blog-like-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.4rem 1.8rem;
      background: linear-gradient(135deg, #fff5f5, #fff);
      border: 1.5px solid #ffe0e0;
      border-radius: 16px;
      margin: 2.5rem 0;
      box-shadow: 0 4px 20px rgba(255,56,56,0.08);
    }
    .blog-like-bar-text {
      font-size: 1rem;
      color: #555;
    }
    .blog-like-bar-text strong {
      color: #FF3838;
    }
    .detail-like-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.5rem;
      border: 2px solid #FF3838;
      border-radius: 30px;
      background: transparent;
      color: #FF3838;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
    }
    .detail-like-btn:hover,
    .detail-like-btn.liked {
      background: #FF3838;
      color: #fff;
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255,56,56,0.3);
    }
    .detail-like-btn .like-count {
      font-size: 1.1rem;
    }

    /* ── Author Card ── */
    .author-card {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.6rem;
      background: #fff;
      border: 1.5px solid #f0f0f0;
      border-radius: 16px;
      margin: 2.5rem 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .author-card img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #FF3838;
      flex-shrink: 0;
    }
    .author-card-info h4 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 0.3rem;
    }
    .author-card-info p {
      font-size: 0.88rem;
      color: #666;
      margin: 0;
      line-height: 1.5;
    }

    /* ── Related CTA ── */
    .blog-detail-cta {
      background: linear-gradient(135deg, #FF3838 0%, #FF8C00 100%);
      border-radius: 20px;
      padding: 2.5rem;
      text-align: center;
      color: #fff;
      margin: 2rem 0;
    }
    .blog-detail-cta h3 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 0.6rem;
    }
    .blog-detail-cta p {
      margin: 0 0 1.4rem;
      opacity: 0.92;
    }
    .blog-detail-cta .cta-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .blog-detail-cta .btn-white {
      background: #fff;
      color: #FF3838;
      border: none;
      padding: 0.7rem 1.6rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .blog-detail-cta .btn-white:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .blog-detail-cta .btn-outline-white {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.7);
      padding: 0.7rem 1.6rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .blog-detail-cta .btn-outline-white:hover {
      background: rgba(255,255,255,0.15);
    }

    /* ── Back button ── */
    .back-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1.4rem 1.5rem;
      max-width: 760px;
      margin: 0 auto;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #FF3838;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: gap 0.2s;
    }
    .back-link:hover { gap: 0.7rem; }

    /* ── Skeleton loading ── */
    .skeleton-hero {
      width: 100%;
      height: 480px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-line {
      height: 1rem;
      border-radius: 6px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 0.8rem;
    }

    /* ── Share buttons ── */
    .share-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin: 1.5rem 0;
    }
    .share-label {
      font-size: 0.88rem;
      color: #888;
      font-weight: 600;
    }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      border: 1.5px solid #e0e0e0;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      color: #555;
      background: #fff;
      transition: all 0.2s;
    }
    .share-btn:hover {
      border-color: #FF3838;
      color: #FF3838;
      transform: translateY(-1px);
    }

    /* ── Not found state ── */
    .blog-not-found {
      text-align: center;
      padding: 5rem 2rem;
      max-width: 500px;
      margin: 0 auto;
    }
    .blog-not-found .emoji { font-size: 4rem; margin-bottom: 1rem; }
    .blog-not-found h2 { color: #1a1a1a; margin-bottom: 0.5rem; }
    .blog-not-found p { color: #666; margin-bottom: 2rem; }

    @media (max-width: 768px) {
      .blog-detail-hero { height: 320px; }
      .blog-detail-hero-overlay { padding: 1.5rem; }
      .author-card { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Top Announcement Bar -->
  <div class="top-announcement-bar">
    <div class="container announcement-inner">
      <span>🔥 <strong>HOT DEAL:</strong> Get <strong>20% OFF</strong> with coupon code</span>
      <span class="announcement-code" onclick="applyPromoCode('PIZZA20'); openCartDrawer();" title="Click to apply PIZZA20">PIZZA20</span>
      <span class="announcement-tag">🛵 Free Delivery &gt; ₹499</span>
      <span class="announcement-tag">⚡ 30-Min Fast Guarantee</span>
    </div>
  </div>

  <!-- Sticky Navbar -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🍕</span>
        <div>Pizza<span>Craft</span></div>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu &amp; Order</a>
        <a href="blog.html" class="nav-link active">Pizza Stories</a>
        <a href="create-blog.html" class="nav-link">Create Blog</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
      </nav>

      <div class="nav-actions">
        <button class="cart-btn" id="openCartBtn" aria-label="View Cart">
          <span>🛒</span>
          <span style="font-size: 0.9rem;">Cart</span>
          <span class="cart-count">0</span>
        </button>
        <div id="userNavActions" style="display: flex; align-items: center; gap: 10px;"></div>
        <button class="mobile-menu-btn" id="mobileMenuToggle" aria-label="Toggle Navigation">☰</button>
      </div>
    </div>
  </header>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cartOverlay" onclick="closeCartDrawer()"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping Cart">
    <div class="cart-drawer-header">
      <h3>🛒 Your Order</h3>
      <button class="cart-close-btn" onclick="closeCartDrawer()" aria-label="Close Cart">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter"></div>
  </aside>

  <!-- ── Blog Hero (populated by JS) ───────────────────────────────────────── -->
  <div id="blogHeroSection">
    <div class="skeleton-hero"></div>
  </div>

  <!-- ── Back Navigation ────────────────────────────────────────────────────── -->
  <div class="back-nav">
    <a href="blog.html" class="back-link">← Back to Pizza Stories</a>
  </div>

  <!-- ── Main Article Content (populated by JS) ─────────────────────────────── -->
  <main id="blogDetailMain">
    <div class="blog-detail-body">
      <div class="skeleton-line" style="width:60%; height:1.2rem;"></div>
      <div class="skeleton-line" style="width:90%;"></div>
      <div class="skeleton-line" style="width:85%;"></div>
      <div class="skeleton-line" style="width:70%;"></div>
      <div class="skeleton-line" style="width:95%;"></div>
      <div class="skeleton-line" style="width:80%;"></div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Floating Controls -->
  <div class="floating-controls">
    <button class="float-btn scroll-top-btn" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top" style="display:none">▲</button>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

  <script>
  // ── Blog Detail Page Logic ─────────────────────────────────────────────────
  (async function() {
    const params = new URLSearchParams(window.location.search);
    const blogId = params.get('id');

    const heroSection  = document.getElementById('blogHeroSection');
    const mainSection  = document.getElementById('blogDetailMain');

    // ── Helper: render not-found state ────────────────────────────────────────
    function showNotFound() {
      heroSection.innerHTML = '';
      mainSection.innerHTML = `
        <div class="blog-not-found">
          <div class="emoji">📭</div>
          <h2>Story Not Found</h2>
          <p>This pizza story may have been removed or the link is incorrect.</p>
          <a href="blog.html" class="btn btn-primary">← Browse All Stories</a>
        </div>`;
    }

    if (!blogId) { showNotFound(); return; }

    // ── Fetch blog from API or localStorage ───────────────────────────────────
    let blog = null;

    try {
      if (window.PizzaCraftAPI) {
        const res = await window.PizzaCraftAPI.getBlog(blogId);
        if (res.ok && res.data && res.data.blog) {
          blog = res.data.blog;
        }
      }
    } catch(e) {}

    // localStorage fallback
    if (!blog) {
      try {
        const local = JSON.parse(localStorage.getItem('pizzacraft_blogs') || '[]');
        blog = local.find(b => b.id === blogId || b._id === blogId) || null;
      } catch(e) {}
    }

    if (!blog) { showNotFound(); return; }

    // ── Update page title & meta ──────────────────────────────────────────────
    document.title = `PizzaCraft | ${blog.title}`;

    // ── Like state ────────────────────────────────────────────────────────────
    let userLikes = [];
    try { userLikes = JSON.parse(localStorage.getItem('pizzacraft_blog_likes') || '[]'); } catch(e) {}
    const isLiked = userLikes.includes(blog.id || blog._id);
    let likeCount = blog.likes || 0;

    // ── Render hero ───────────────────────────────────────────────────────────
    heroSection.innerHTML = `
      <div class="blog-detail-hero">
        <img src="${blog.image || 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=1200&auto=format&fit=crop&q=80'}"
             alt="${blog.title}"
             onerror="this.src='https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=1200&auto=format&fit=crop&q=80'">
        <div class="blog-detail-hero-overlay">
          <div class="blog-detail-hero-content">
            <span class="blog-category-tag">${blog.category || 'Pizza Story'}</span>
            <h1>${blog.title}</h1>
            <div class="blog-detail-meta">
              <div class="blog-detail-author-row">
                <img src="${blog.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(blog.author || 'Chef')}&background=FF3838&color=fff`}"
                     alt="${blog.author}"
                     onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(blog.author || 'Chef')}&background=FF3838&color=fff'">
                <strong>${blog.author}</strong>
              </div>
              <span>📅 ${blog.date || 'Recently Published'}</span>
              <span>⏱️ ${blog.readTime || '5 min read'}</span>
              <span>❤️ ${likeCount} likes</span>
            </div>
          </div>
        </div>
      </div>`;

    // ── Format content (support multi-paragraphs) ─────────────────────────────
    const paragraphs = (blog.content || '')
      .split(/\n\n+/)
      .map(p => p.trim())
      .filter(Boolean)
      .map(p => `<p>${p}</p>`)
      .join('');

    // ── Render main article ───────────────────────────────────────────────────
    mainSection.innerHTML = `
      <div class="blog-detail-body">

        <!-- Share Row -->
        <div class="share-row">
          <span class="share-label">Share this story:</span>
          <button class="share-btn" onclick="shareStory('twitter')">🐦 Twitter</button>
          <button class="share-btn" onclick="shareStory('whatsapp')">💬 WhatsApp</button>
          <button class="share-btn" onclick="shareStory('copy')">🔗 Copy Link</button>
        </div>

        <!-- Article Content -->
        <div class="blog-detail-content">${paragraphs || `<p>${blog.content || ''}</p>`}</div>

        <!-- Like Bar -->
        <div class="blog-like-bar">
          <div class="blog-like-bar-text">
            Enjoyed this story? Give it some love! 
            <strong id="likeCountDisplay">${likeCount} people</strong> already liked it.
          </div>
          <button class="detail-like-btn ${isLiked ? 'liked' : ''}" id="detailLikeBtn" onclick="handleDetailLike()">
            <span>${isLiked ? '❤️' : '🤍'}</span>
            <span class="like-count" id="likeCountBtn">${likeCount}</span>
            <span>${isLiked ? 'Liked!' : 'Like this Story'}</span>
          </button>
        </div>

        <!-- Author Card -->
        <div class="author-card">
          <img src="${blog.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(blog.author || 'Chef')}&background=FF3838&color=fff`}"
               alt="${blog.author}"
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(blog.author || 'Chef')}&background=FF3838&color=fff'">
          <div class="author-card-info">
            <h4>Written by ${blog.author}</h4>
            <p>Passionate pizza artisan and culinary storyteller at PizzaCraft. Sharing the secrets of authentic Neapolitan pizza-making traditions, one story at a time.</p>
          </div>
        </div>

        <!-- Edit / Delete Actions -->
        <div id="blogCrudActions" style="
          display:flex;gap:10px;flex-wrap:wrap;margin:1.5rem 0;
          padding:1.2rem 1.4rem;
          background:#F9FAFB;
          border:1.5px solid #e5e7eb;
          border-radius:14px;
          align-items:center;
        ">
          <span style="font-size:0.88rem;color:#888;font-weight:600;">Manage this story:</span>
          <a id="editBlogLink" href="#" class="blog-action-btn blog-action-edit" style="
            padding:0.45rem 1rem;border-radius:20px;border:1.5px solid #3B82F6;
            color:#3B82F6;font-size:0.85rem;font-weight:700;text-decoration:none;transition:all 0.2s;
          " onmouseover="this.style.background='#3B82F6';this.style.color='#fff'"
             onmouseout="this.style.background='transparent';this.style.color='#3B82F6'">
            ✏️ Edit Story
          </a>
          <button id="deleteBlogBtn" onclick="handleDetailDelete()" style="
            padding:0.45rem 1rem;border-radius:20px;border:1.5px solid #EF4444;
            color:#EF4444;font-size:0.85rem;font-weight:700;cursor:pointer;background:transparent;transition:all 0.2s;font-family:inherit;
          " onmouseover="this.style.background='#EF4444';this.style.color='#fff'"
             onmouseout="this.style.background='transparent';this.style.color='#EF4444'">
            🗑️ Delete Story
          </button>
        </div>

        <!-- CTA Section -->
        <div class="blog-detail-cta">
          <h3>🍕 Ready to Taste the Craft?</h3>
          <p>Inspired by what you read? Order our artisanal pizzas made with the same passion, or share your own pizza story with the world.</p>
          <div class="cta-btns">
            <a href="menu.html" class="btn-white">Order Now →</a>
            <a href="create-blog.html" class="btn-outline-white">Write Your Story</a>
            <a href="blog.html" class="btn-outline-white">Browse All Stories</a>
          </div>
        </div>

      </div>`;

    // ── Update Edit link & wire delete ───────────────────────────────────────
    const editLink = document.getElementById('editBlogLink');
    if (editLink) editLink.href = `edit-blog.html?id=${encodeURIComponent(blog.id || blog._id)}`;

    window.handleDetailDelete = async function() {
      const title = blog.title || 'this story';
      if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;

      const currentId = blog.id || blog._id;
      let deleted = false;

      if (window.PizzaCraftAPI) {
        const res = await window.PizzaCraftAPI.deleteBlog(currentId);
        if (res.ok && res.data?.success) {
          deleted = true;
        } else if (!res.networkError) {
          showToast(res.data?.message || 'Could not delete story.', 'error');
          return;
        }
      }

      // Local fallback
      try {
        const local = JSON.parse(localStorage.getItem('pizzacraft_blogs') || '[]');
        const filtered = local.filter(b => b.id !== currentId && b._id !== currentId);
        localStorage.setItem('pizzacraft_blogs', JSON.stringify(filtered));
      } catch(e) {}

      showToast('🗑️ Story deleted.', 'success');
      setTimeout(() => window.location.href = 'blog.html', 1000);
    };

    // ── Scroll-to-top button ──────────────────────────────────────────────────
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scrollTopBtn');
      if (btn) btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
    });

    // ── Like handler ──────────────────────────────────────────────────────────
    window.handleDetailLike = async function() {
      const btn = document.getElementById('detailLikeBtn');
      const countDisplay = document.getElementById('likeCountDisplay');
      const countBtn = document.getElementById('likeCountBtn');
      const currentId = blog.id || blog._id;

      let likes = [];
      try { likes = JSON.parse(localStorage.getItem('pizzacraft_blog_likes') || '[]'); } catch(e) {}
      const liked = likes.includes(currentId);
      const action = liked ? 'unlike' : 'like';

      if (liked) {
        likes = likes.filter(id => id !== currentId);
        likeCount = Math.max(0, likeCount - 1);
        btn.classList.remove('liked');
        btn.innerHTML = `<span>🤍</span><span class="like-count">${likeCount}</span><span>Like this Story</span>`;
        showToast('Removed like', 'info');
      } else {
        likes.push(currentId);
        likeCount++;
        btn.classList.add('liked');
        btn.innerHTML = `<span>❤️</span><span class="like-count">${likeCount}</span><span>Liked!</span>`;
        showToast('❤️ Thank you for liking this story!', 'success');
      }

      localStorage.setItem('pizzacraft_blog_likes', JSON.stringify(likes));
      if (countDisplay) countDisplay.textContent = `${likeCount} people`;

      if (window.PizzaCraftAPI) {
        try { await window.PizzaCraftAPI.likeBlog(currentId, action); } catch(e) {}
      }
    };

    // ── Share handler ─────────────────────────────────────────────────────────
    window.shareStory = function(platform) {
      const url = window.location.href;
      const text = `Check out this pizza story: "${blog.title}" on PizzaCraft!`;
      if (platform === 'twitter') {
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
      } else if (platform === 'whatsapp') {
        window.open(`https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`, '_blank');
      } else if (platform === 'copy') {
        navigator.clipboard.writeText(url).then(() => {
          showToast('🔗 Link copied to clipboard!', 'success');
        }).catch(() => {
          showToast('Could not copy link.', 'info');
        });
      }
    };

  })();
  </script>
